<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14161c">
<meta http-equiv="Cache-Control" content="no-cache, must-revalidate">
<title>Doodl</title>
<link rel="stylesheet" href="./css/app.css?v=108">
</head>
<body>

<!-- home ---------------------------------------------------------------- -->
<section id="home" class="screen active">
  <h1 class="brand">Doodl</h1>
  <p class="tagline">Doodle through the meeting. It listens, you tap the moments that matter.</p>

  <button class="big-btn" id="newSessionBtn">Start a session</button>
  <button class="big-btn ghost" id="quietSessionBtn">Doodle only — no microphone</button>

  <p class="section-label">Past sessions</p>
  <div id="sessionList"></div>

  <div class="foot">
    <span id="storageLine"></span>
    <button id="debugToggle">log</button>
  </div>
</section>

<!-- active session ------------------------------------------------------ -->
<section id="session" class="screen">
  <canvas id="bgCanvas"></canvas>
  <canvas id="inkCanvas"></canvas>
  <div id="flash"></div>

  <div class="hud">
    <button class="pill" id="endBtn">Finish</button>
    <span class="pill status"><span class="dot" id="stateDot"></span><span id="stateText">off</span></span>
    <span class="pill spacer"></span>
    <button class="pill icon" id="undoBtn" aria-label="Undo">&#8630;</button>
    <button class="pill" id="toolsBtn">Tools</button>
  </div>

  <button id="highlightBtn"><span class="count" id="hlCount">0</span>Highlight</button>

  <div id="tools">
    <div class="tool-row">
      <h4>Colour</h4>
      <div class="swatches" id="swatches"></div>
    </div>
    <div class="tool-row">
      <h4>Thickness</h4>
      <div class="sizes" id="sizes"></div>
    </div>
    <div class="tool-row">
      <h4>Paper</h4>
      <div class="bgs" id="bgs"></div>
    </div>
    <div class="tool-row">
      <h4>Page</h4>
      <button class="bg-opt" id="clearBtn" style="color:#ff8080">Clear everything</button>
    </div>
    <button class="big-btn ghost" id="toolsDone" style="margin:0">Done</button>
  </div>
</section>

<!-- wrap-up ------------------------------------------------------------- -->
<section id="wrap" class="screen">
  <p class="section-label" id="wrapDate"></p>
  <input class="title-input" id="wrapTitle" placeholder="Name this meeting">

  <p class="section-label">Highlights</p>
  <p class="legend"><i></i> marks the moment you tapped</p>
  <div id="hlList"></div>

  <p class="section-label">Full transcript</p>
  <div class="transcript" id="transcriptBox"></div>

  <button class="big-btn" id="shareBtn" style="margin-top:22px">Export</button>
  <button class="big-btn ghost" id="homeBtn">Back to sessions</button>
  <button class="big-btn ghost" id="deleteBtn" style="color:#ff8080">Delete this session</button>
</section>

<div id="insetProbe"></div>
<div id="debug"></div>

<script type="module" src="./js/app.js?v=108"></script>
</body>
</html>
